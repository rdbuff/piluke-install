<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Installer Piluke</title>
<style>
  :root { --pink:#ff6b9e; --deep:#eb4582; --blush:#fff0f3; --text:#6b2c4c; --soft:#a86b8a; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:linear-gradient(#fff0f3,#ffcade); font-family:ui-rounded,-apple-system,"SF Pro Rounded",system-ui,sans-serif;
         color:var(--text); padding:24px 16px; text-align:center; }

          box-shadow:0 12px 30px rgba(255,107,158,.25); }
  .pill { font-size:84px; display:inline-block; animation:bob 1.4s ease-in-out infinite alternate; }
  @keyframes bob { from { transform:translateY(0) rotate(-12deg);} to { transform:translateY(-12px) rotate(8deg);} }
  h1 { margin:8px 0 4px; font-size:34px; }
  p { color:var(--soft); margin:6px 0 22px; line-height:1.45; }
  a.btn { display:block; background:linear-gradient(135deg,var(--pink),var(--deep)); color:#fff; text-decoration:none;
          font-weight:800; font-size:20px; padding:18px; border-radius:999px; box-shadow:0 8px 18px rgba(235,69,130,.4); }
  a.btn:active { transform:scale(.94); }
  small { display:block; margin-top:20px; color:var(--soft); font-size:13px; line-height:1.5; }
</style>
</head>
<body>
  <div class="card">
    <div class="pill">💊</div>
    <h1>Piluke</h1>

  </div>
</body>
</html>
